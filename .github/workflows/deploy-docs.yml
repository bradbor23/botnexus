name: "Deploy: Documentation"

# The site build is a PR GATE, not only a post-merge step.
#
# It used to run exclusively on push to main, so a dead link landed on main and the failure
# appeared where nobody looks - `Deploy: Documentation` sat red for days over two `./skills`
# links in docs/user-guide/plugins.md, and the published site silently stopped updating the
# whole time. VitePress fails the build on a dead link, which makes it a perfectly good
# pre-merge check; nothing about it required waiting until the change was unrevertable.
#
# One workflow rather than a separate PR-validation copy, deliberately: the gate must build
# the site EXACTLY the way the deploy builds it. A second workflow with its own node version
# or install command is free to drift into passing what the real build rejects, and a gate
# that disagrees with the thing it guards is worse than no gate.
#
# The split is by event, not by content: `build` runs everywhere, `deploy` is skipped on
# pull_request, and the two Pages-specific steps are skipped with it. A PR therefore never
# needs Pages credentials and can never publish.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'package.json'
      - 'package-lock.json'
      # The gate is gated: a PR that edits this file re-runs it, so the check cannot be
      # disarmed by a change that never has to prove itself.
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

# Least privilege at the top; the two jobs that genuinely need Pages ask for it themselves.
permissions:
  contents: read

# Deploys keep the single serialized `pages` group and are never cancelled. PR builds are
# per-ref and DO cancel, so a run superseded by a new push stops instead of queueing behind
# the deployment lane.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Docs site builds (a dead link fails the PR)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # VitePress reads git history for last-updated timestamps.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # THE GATE. Exits non-zero on a dead link, which is the whole point of running it here.
      - name: Build VitePress site
        run: npm run docs:build

      # Pages-only from here down. `base` is hardcoded in docs/.vitepress/config.mts and this
      # step runs after the build, so skipping it on a PR cannot change what the gate checked.
      - name: Setup GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Publish to GitHub Pages
    # A pull request validates; it never publishes.
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Matches the official Pages pattern. Job-level `permissions` sets every unlisted scope to
    # none, so these are stated in full rather than trimmed to what looks necessary.
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
